# Optional: a local PostgreSQL database. Start with:  docker compose up -d
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ward
      POSTGRES_PASSWORD: ward_password
      POSTGRES_DB: ward_db
    ports:
      - "5432:5432"
    volumes:
      - ward_pgdata:/var/lib/postgresql/data
volumes:
  ward_pgdata:
