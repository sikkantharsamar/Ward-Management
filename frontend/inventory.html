<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inventory</title>
  <link rel="stylesheet" href="css/style.css?v=clinical-1">
</head>
<body>
  <div id="nav"></div>
  <main>
    <div class="card">
      <h2>Medicine and supply stock</h2>
      <div class="row"><select id="filter" style="width:auto"><option value="">All</option><option value="medicine">Medicines</option><option value="supply">Supplies</option></select></div>
      <div id="items" style="margin-top:10px"></div>
    </div>
    <div class="grid" id="manage" style="display:none">
      <div class="card">
        <h2>Add item</h2>
        <form id="add-form">
          <label>Name</label><input name="name" required>
          <label>Category</label><select name="category"><option value="medicine">Medicine</option><option value="supply">Supply</option></select>
          <label>Unit</label><input name="unit" value="unit">
          <label>Quantity</label><input name="quantity" type="number" min="0" value="0">
          <label>Reorder level</label><input name="reorder_level" type="number" min="0" value="10">
          <label>Expiry date</label><input name="expiry_date" type="date">
          <p><button type="submit" class="green">Add</button></p>
        </form>
      </div>
      <div class="card">
        <h2>Adjust stock</h2>
        <form id="adjust-form">
          <label>Item</label><select name="item_id" id="adjust-item" required></select>
          <label>Change (+ received, - used)</label><input name="change" type="number" required>
          <label>Reason</label><input name="reason" required>
          <p><button type="submit">Save</button></p>
        </form>
      </div>
    </div>
  </main>
  <script src="js/common.js"></script>
  <script src="js/inventory.js"></script>
</body>
</html>
